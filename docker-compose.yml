services:
  postgres:
    image: postgres:16-alpine
    container_name: cineglobe_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cineglobe}
      POSTGRES_USER: ${POSTGRES_USER:-cineglobe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cineglobe}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cineglobe} -d ${POSTGRES_DB:-cineglobe}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cineglobe_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cineglobe_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    # Local dev: Django's dev server instead of the image's gunicorn.
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://${POSTGRES_USER:-cineglobe}:${POSTGRES_PASSWORD:-cineglobe}@postgres:5432/${POSTGRES_DB:-cineglobe}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cineglobe_network

volumes:
  postgres_data:
    driver: local

networks:
  cineglobe_network:
    driver: bridge
